<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>釜山旅遊大J人行李清單</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f9fc; color: #2f3542; margin: 0; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; text-align: center; color: #ff6b81; }
        h2 { font-size: 18px; border-left: 4px solid #ff6b81; padding-left: 8px; margin-top: 24px; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #dfe4ea; font-size: 15px; }
        input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; accent-color: #ff6b81; cursor: pointer; }
        input[type="checkbox"]:checked + span { text-decoration: line-through; color: #a4b0be; }
        .warning { background: #fff2f2; border: 1px solid #ff4757; padding: 16px; border-radius: 8px; margin-top: 24px; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎒 釜山旅遊大J人行李清單</h1>
    <p style="text-align:center; color:#747d8c;">10/1 - 10/6 專用勾選 App</p>
    
    <h2>📄 重要證件資料</h2>
    <ul>
        <li><label><input type="checkbox"><span>護照 (Passport)</span></label></li>
        <li><label><input type="checkbox"><span>身分證 / 國家電子簽證 (ID / Visa)</span></label></li>
        <li><label><input type="checkbox"><span>登機證 / 機票 / 保險卡 (Boarding Pass / Insurance)</span></label></li>
        <li><label><input type="checkbox"><span>信用卡與台幣/外幣現金 (Credit Card / Cash)</span></label></li>
        <li><label><input type="checkbox"><span>交通卡 T-money (Transit Card)</span></label></li>
    </ul>

    <h2>👕 服裝 (11-23°C 溫差大)</h2>
    <ul>
        <li><label><input type="checkbox"><span>短袖 / 薄長袖 / 針織衫 / 帽T (Tops)</span></label></li>
        <li><label><input type="checkbox"><span>長褲 / 內衣褲 / 睡衣 (Bottoms / Underwear)</span></label></li>
        <li><label><input type="checkbox"><span>發熱衣褲 (Thermal Wear)</span></label></li>
        <li><label><input type="checkbox"><span>防風外套 / 風衣 - 海邊必備 (Windbreaker Jacket)</span></label></li>
        <li><label><input type="checkbox"><span>好走布鞋 / 運動鞋 (Comfortable Shoes)</span></label></li>
    </ul>

    <h2>🔌 3C 產品</h2>
    <ul>
        <li><label><input type="checkbox"><span>手機、耳機、SIM卡 / eSIM (Phone, SIM)</span></label></li>
        <li><label><input type="checkbox"><span>充電器、歐規圓形雙孔轉接頭 (Chargers / Adapter)</span></label></li>
        <li><label><input type="checkbox"><span>行動電源 - 僅限隨身行李，最多2個 (Power Bank - Carry-on only)</span></label></li>
    </ul>

    <h2>🧴 生活用品 & 藥品</h2>
    <ul>
        <li><label><input type="checkbox"><span>盥洗用品 / 牙刷牙膏 / 保養品 (Toiletries / Skincare)</span></label></li>
        <li><label><input type="checkbox"><span>常備藥品 - 嚴禁帶含 IPA 的 EVE 止痛藥 (Medicines)</span></label></li>
        <li><label><input type="checkbox"><span>吹風機、電棒、剪刀、指甲剪 - ⚠️ 限制託運 (Hair Dryer / Scissors - Checked only)</span></label></li>
        <li><label><input type="checkbox"><span>暖暖包 - 回程須手提 (Hand Warmers)</span></label></li>
    </ul>

    <div class="warning">
        <strong>⚠️ 哥幫你劃重點提醒：</strong>
        <ul>
            <li>隨身液體小於 100ml 須裝透明夾鏈袋。</li>
            <li>行動電源絕對禁止託運，回程暖暖包只能手提。</li>
            <li>出發前填好電子入境卡，下載 Naver Map 導航！</li>
        </ul>
    </div>
</div>
</body>
</html>
